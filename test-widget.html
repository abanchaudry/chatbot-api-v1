<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Local Chat Widget Tester - Multi-Tenant SaaS</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/remixicon@3.5.0/fonts/remixicon.css" rel="stylesheet">
  <style>
    body {
      background-color: #f8fafc;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }
    .top-hero {
      background: linear-gradient(135deg, #1e293b 0%, #0f172a 100%);
      color: white;
      padding: 30px 20px;
    }
    .chat-container {
      max-width: 720px;
      margin: -20px auto 40px auto;
      background: #ffffff;
      border-radius: 16px;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.1), 0 8px 10px -6px rgba(0, 0, 0, 0.1);
      display: flex;
      flex-direction: column;
      height: 620px;
      overflow: hidden;
      border: 1px solid #e2e8f0;
    }
    .chat-header {
      background: #3167f3;
      color: white;
      padding: 16px 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .chat-messages {
      flex: 1;
      padding: 20px;
      overflow-y: auto;
      background: #f8fafc;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }
    .msg {
      max-width: 80%;
      padding: 12px 16px;
      border-radius: 14px;
      font-size: 14px;
      line-height: 1.5;
      word-wrap: break-word;
    }
    .msg-bot {
      align-self: flex-start;
      background: #ffffff;
      color: #1e293b;
      border: 1px solid #e2e8f0;
      border-bottom-left-radius: 4px;
    }
    .msg-user {
      align-self: flex-end;
      background: #3167f3;
      color: #ffffff;
      border-bottom-right-radius: 4px;
    }
    .msg-meta {
      font-size: 11px;
      margin-top: 4px;
      opacity: 0.7;
    }
    .chat-input-area {
      padding: 16px;
      background: #ffffff;
      border-top: 1px solid #e2e8f0;
    }
    .typing-indicator {
      font-size: 12px;
      color: #64748b;
      font-style: italic;
    }
  </style>
</head>
<body>

  <!-- Top Hero Bar -->
  <div class="top-hero">
    <div class="container text-center">
      <h3 class="fw-bold mb-1"><i class="ri-chat-voice-line text-primary me-2"></i>Multi-Tenant Client Widget Simulator</h3>
      <p class="text-white-50 mb-0" style="font-size: 14px;">
        Test how different businesses respond to website visitors using their public token (<code>pk_live_...</code>).
      </p>
    </div>
  </div>

  <div class="container my-4">
    <!-- Config Card -->
    <div class="card border-0 shadow-sm mb-4 mx-auto" style="max-width: 720px; border-radius: 12px;">
      <div class="card-body p-3">
        <div class="row g-2 align-items-center">
          <div class="col-md-7">
            <label class="form-label mb-1 fw-bold text-muted" style="font-size: 11px;">CLIENT PUBLIC TOKEN (x-client-token)</label>
            <div class="input-group input-group-sm">
              <span class="input-group-text bg-light"><i class="ri-key-2-line"></i></span>
              <input type="text" id="clientToken" class="form-control" placeholder="Paste pk_live_... token here" value="pk_live_4374c289d3394ceb87d30b0595f8bcd0">
            </div>
          </div>
          <div class="col-md-5">
            <label class="form-label mb-1 fw-bold text-muted" style="font-size: 11px;">BACKEND API ENDPOINT</label>
            <input type="text" id="apiUrl" class="form-control form-control-sm" value="http://127.0.0.1:8787/ask">
          </div>
        </div>
      </div>
    </div>

    <!-- Chat Simulator Box -->
    <div class="chat-container">
      <div class="chat-header">
        <div class="d-flex align-items-center">
          <div class="rounded-circle bg-white text-primary d-flex align-items-center justify-content-center me-2" style="width: 36px; height: 36px; font-size: 18px;">
            <i class="ri-robot-2-line"></i>
          </div>
          <div>
            <div class="fw-bold" style="font-size: 15px;">Website Assistant</div>
            <div style="font-size: 11px; opacity: 0.85;">Connected to Multi-Tenant Backend</div>
          </div>
        </div>
        <button class="btn btn-sm btn-outline-light border-0" onclick="clearChat()" title="Clear Conversation">
          <i class="ri-refresh-line"></i> Clear
        </button>
      </div>

      <!-- Messages Stream -->
      <div class="chat-messages" id="messagesList">
        <div class="msg msg-bot">
          Hello! I am your AI assistant for this business. How can I help you today?
          <div class="msg-meta">Ready</div>
        </div>
      </div>

      <!-- Typing Indicator -->
      <div id="typingIndicator" class="px-3 py-1 bg-white border-top text-muted d-none" style="font-size: 12px;">
        <i class="ri-loader-4-line remix-spin me-1"></i> Assistant is typing...
      </div>

      <!-- Input Area -->
      <div class="chat-input-area">
        <form id="chatForm" onsubmit="handleSend(event)" class="d-flex gap-2">
          <input type="text" id="userInput" class="form-control" placeholder="Ask a question about this business..." autocomplete="off" required>
          <button type="submit" id="sendBtn" class="btn btn-primary px-4 fw-semibold">
            <i class="ri-send-plane-fill me-1"></i> Send
          </button>
        </form>
      </div>
    </div>
  </div>

  <script>
    const userId = "visitor-" + Math.random().toString(36).substring(2, 9);

    function appendMessage(text, isUser, meta = "") {
      const list = document.getElementById("messagesList");
      const div = document.createElement("div");
      div.className = "msg " + (isUser ? "msg-user" : "msg-bot");
      div.innerText = text;
      
      if (meta) {
        const metaDiv = document.createElement("div");
        metaDiv.className = "msg-meta";
        metaDiv.innerText = meta;
        div.appendChild(metaDiv);
      }

      list.appendChild(div);
      list.scrollTop = list.scrollHeight;
    }

    function clearChat() {
      const list = document.getElementById("messagesList");
      list.innerHTML = `
        <div class="msg msg-bot">
          Conversation restarted. Ask anything about this business!
          <div class="msg-meta">Ready</div>
        </div>
      `;
    }

    async function handleSend(e) {
      e.preventDefault();
      const input = document.getElementById("userInput");
      const sendBtn = document.getElementById("sendBtn");
      const typing = document.getElementById("typingIndicator");
      const token = document.getElementById("clientToken").value.trim();
      const apiUrl = document.getElementById("apiUrl").value.trim();

      const message = input.value.trim();
      if (!message) return;

      appendMessage(message, true, "You");
      input.value = "";
      input.disabled = true;
      sendBtn.disabled = true;
      typing.classList.remove("d-none");

      try {
        const res = await fetch(apiUrl, {
          method: "POST",
          headers: {
            "Content-Type": "application/json",
            "x-client-token": token
          },
          body: JSON.stringify({
            message: message,
            userId: userId
          })
        });

        const data = await res.json();
        typing.classList.add("d-none");

        if (res.ok && data.ok) {
          const reply = data.answer || data.response || data.message || "No response received";
          appendMessage(reply, false, "Assistant");
        } else {
          appendMessage("Error: " + (data.message || data.error || "Failed to get response from server"), false, "System Error");
        }
      } catch (err) {
        typing.classList.add("d-none");
        appendMessage("Network Error: " + err.message + ". Make sure backend is running on port 8787.", false, "Connection Error");
      } finally {
        input.disabled = false;
        sendBtn.disabled = false;
        input.focus();
      }
    }
  </script>
</body>
</html>
